<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebP to PNG/JPG Converter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #6c63ff;
      --secondary-color: #4a44c9;
      --dark-color: #2a2a4a;
      --light-color: #f8f9fa;
      --success-color: #28a745;
    }
    
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--dark-color);
    }
    
    .container {
      max-width: 800px;
      margin-top: 30px;
      margin-bottom: 50px;
    }
    
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      background: white;
    }
    
    .card-header {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      color: white;
      text-align: center;
      padding: 20px;
      border-bottom: none;
    }
    
    .card-body {
      padding: 30px;
    }
    
    .nav-pills .nav-link {
      color: var(--dark-color);
      border-radius: 20px;
      margin: 0 5px;
      padding: 10px 20px;
    }
    
    .nav-pills .nav-link.active {
      background: var(--primary-color);
      color: white;
    }
    
    .form-control, .btn {
      border-radius: 10px;
    }
    
    .btn-primary {
      background: var(--primary-color);
      border: none;
      padding: 10px 20px;
    }
    
    .btn-primary:hover {
      background: var(--secondary-color);
    }
    
    .btn-success {
      background: var(--success-color);
      border: none;
      padding: 10px 20px;
    }
    
    .preview-container {
      text-align: center;
      margin: 20px 0;
      display: none;
    }
    
    .preview-image {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .format-option {
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .format-option:hover {
      transform: translateY(-5px);
    }
    
    .spinner-border {
      display: none;
    }
    
    .feature-icon {
      font-size: 2rem;
      margin-bottom: 15px;
      color: var(--primary-color);
    }
    
    .tab-content {
      padding: 20px 0;
    }
    
    .converter-footer {
      text-align: center;
      margin-top: 30px;
      color: #6c757d;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h2><i class="fas fa-exchange-alt me-2"></i>WebP to PNG/JPG Converter</h2>
        <p class="mb-0">Convert your WebP images to PNG or JPG format easily</p>
      </div>
      
      <div class="card-body">
        <ul class="nav nav-pills mb-4 justify-content-center" id="converterTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="upload-tab" data-bs-toggle="pill" data-bs-target="#upload" type="button" role="tab" aria-controls="upload" aria-selected="true">
              <i class="fas fa-upload me-1"></i> Upload File
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="url-tab" data-bs-toggle="pill" data-bs-target="#url" type="button" role="tab" aria-controls="url" aria-selected="false">
              <i class="fas fa-link me-1"></i> From URL
            </button>
          </li>
        </ul>
        
        <div class="tab-content" id="converterTabsContent">
          <!-- Upload File Tab -->
          <div class="tab-pane fade show active" id="upload" role="tabpanel" aria-labelledby="upload-tab">
            <div class="mb-3">
              <label for="webpInput" class="form-label">Select WebP Image</label>
              <input class="form-control" type="file" id="webpInput" accept=".webp">
            </div>
          </div>
          
          <!-- From URL Tab -->
          <div class="tab-pane fade" id="url" role="tabpanel" aria-labelledby="url-tab">
            <div class="mb-3">
              <label for="webpUrl" class="form-label">WebP Image URL</label>
              <input type="text" class="form-control" id="webpUrl" placeholder="https://example.com/image.webp">
            </div>
          </div>
        </div>
        
        <div class="preview-container" id="previewContainer">
          <h5>Image Preview</h5>
          <img src="" class="preview-image mb-2" id="previewImage">
          <p class="text-muted" id="imageDimensions"></p>
        </div>
        
        <div class="mb-4">
          <label class="form-label">Choose Output Format:</label>
          <div class="d-flex justify-content-center gap-3">
            <div class="format-option text-center">
              <input type="radio" class="btn-check" name="outputFormat" id="png" value="png" checked>
              <label class="btn btn-outline-primary d-flex flex-column align-items-center" for="png">
                <i class="fas fa-file-image feature-icon"></i>
                <span>PNG</span>
              </label>
            </div>
            
            <div class="format-option text-center">
              <input type="radio" class="btn-check" name="outputFormat" id="jpg" value="jpg">
              <label class="btn btn-outline-primary d-flex flex-column align-items-center" for="jpg">
                <i class="fas fa-file-image feature-icon"></i>
                <span>JPG</span>
              </label>
            </div>
          </div>
        </div>
        
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-primary btn-lg" id="convertBtn">
            <span class="spinner-border spinner-border-sm me-2" id="loadingSpinner" role="status" aria-hidden="true"></span>
            <i class="fas fa-sync-alt me-2"></i>Convert & Download
          </button>
        </div>
        
        <div class="converter-footer">
          <p>This tool works entirely in your browser. Your images are not uploaded to any server.</p>
        </div>
      </div>
    </div>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const webpInput = document.getElementById('webpInput');
      const webpUrl = document.getElementById('webpUrl');
      const convertBtn = document.getElementById('convertBtn');
      const previewContainer = document.getElementById('previewContainer');
      const previewImage = document.getElementById('previewImage');
      const imageDimensions = document.getElementById('imageDimensions');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      let currentImage = null;
      
      // Handle file input change
      webpInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
          const file = e.target.files[0];
          loadImageFromFile(file);
        }
      });
      
      // Handle URL input change
      webpUrl.addEventListener('change', function() {
        if (webpUrl.value) {
          loadImageFromUrl(webpUrl.value);
        }
      });
      
      // Convert button click
      convertBtn.addEventListener('click', function() {
        if (!currentImage) {
          alert("Please select a WebP image first.");
          return;
        }
        
        const outputFormat = document.querySelector('input[name="outputFormat"]:checked').value;
        convertImage(currentImage, outputFormat);
      });
      
      // Function to load image from file
      function loadImageFromFile(file) {
        if (!file.type.match('image/webp')) {
          alert("Please select a WebP image.");
          return;
        }
        
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            displayPreview(img, file.name);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
      
      // Function to load image from URL
      function loadImageFromUrl(url) {
        if (!url.toLowerCase().endsWith('.webp')) {
          alert("Please enter a WebP image URL.");
          return;
        }
        
        showLoading(true);
        
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = function() {
          displayPreview(img, url.substring(url.lastIndexOf('/') + 1));
          showLoading(false);
        };
        img.onerror = function() {
          alert("Error loading image. Please check the URL and try again.");
          showLoading(false);
        };
        img.src = url;
      }
      
      // Function to display image preview
      function displayPreview(img, filename) {
        currentImage = img;
        previewImage.src = img.src;
        imageDimensions.textContent = `Dimensions: ${img.width} × ${img.height} pixels`;
        previewContainer.style.display = 'block';
        
        // Scroll to preview
        previewContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      
      // Function to convert image
      function convertImage(img, format) {
        showLoading(true);
        
        setTimeout(function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          
          canvas.toBlob(function(blob) {
            const link = document.createElement('a');
            const fileName = `converted-image.${format}`;
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
            
            showLoading(false);
          }, `image/${format}`);
        }, 500);
      }
      
      // Function to show/hide loading spinner
      function showLoading(show) {
        if (show) {
          loadingSpinner.style.display = 'inline-block';
          convertBtn.disabled = true;
        } else {
          loadingSpinner.style.display = 'none';
          convertBtn.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
